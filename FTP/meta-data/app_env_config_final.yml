eventConfig:
  enabled: false
  staticDir: false
  eventDataFilenamePattern: "'event_data/'yyyy-MM-dd-HH-mm'-event_data.csv'"


server:
  type: simple
  applicationContextPath: /
  adminContextPath: /admin
  connector:
    port: 8080
    type: http
  rootPath: /*

# Database settings.
database:
  # the name of the JDBC driver, mysql in our case
  driverClass: com.mysql.jdbc.Driver
  # the username
  user: mysql
  # the password
  password: mysql
  # the JDBC URL; the database is called DWGettingStarted
  url: jdbc:mysql://localhost:3306/ftpapp?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true

singleThreadingEnable: false

dirConfigParam:
  defaultRole:
    fileSaveDir: "D:/workspace/project/ftp-app/saved-files/"
    configDataFilePath: "D:/workspace/ftp-application/FTP/meta-data/config-files-custom/"
    staticDataFilename: "app_static_data.json"
    fileMappingConfigFilePath: "D:/workspace/ftp-application/FTP/meta-data/config-files/file-mapping-config/file-mapping-config.yml"
    splitTextFileConfigPath: "D:/workspace/ftp-application/FTP/meta-data/config-files/file-mapping-config/split-file-config.yml"
    standAloneConfigPath:
      - "D:/workspace/ftp-application/FTP/meta-data/config-files/standalone/config_1.yml"
    scanDirConfigFilePath: "D:/workspace/ftp-application/FTP/meta-data/config-files/scan-dir-config/scan-dir-config.yml"
    tableDbConfigFilePath:
      - "D:/workspace/ftp-application/FTP/meta-data/config-files/table-db-config/table-db-config-mysql.yml"
      - "D:/workspace/ftp-application/FTP/meta-data/config-files/table-db-config/table-db-config-oracle.yml"
    ndTo1dConfigFilePath:
      - "D:/workspace/ftp-application/FTP/meta-data/config-files/nd-to-1d-config/nd-to-1d-config.yml"
    isRelativePath: "true"
    assetsDir: "D:/workspace/project/"
    publicDir: "../.."
    publicPostDir: "/project"


commonConfigFilePath: "D:/workspace/ftp-application/FTP/meta-data/config-files/"

#  forgotPasswordMessage: "Forgot password request submitted, Please check your email."
forgotPasswordMessage: "Forgot password request submitted, Please create password."
loadRoleStatusOnPageLoad: "FromRoleConfig" #"isAdminUser" #FromRoleConfig
forgotPasswordEnable: true
rolesFileName:
  - "invalid-role-file-path"
fileNotFoundMapping:
  - "invalid-file-not-found-mapping"
staticDataFilename: "invalid-static-data-file-name"
rateLimitThreshold: 2
enableMysqlTableName:
  - users
  - event_data
  - file_path


eventDataFilenamePattern: "'event_data/'yyyy-MM-dd-HH-mm'-event_data.csv'"
userDataFilename: "user_data.csv"

cookieName: "web-app"
supportedFileType:
  - pdf
  - txt
  - docx
  - doc
  - xlsx
  - xls
  - pptx
  - ppt
  - mp3
  - 3gp
  - mp4
  - exe
  - jpeg
  - jpg
  - png


maxFileSize: 10240001 #i.e. #i.e. 2048000 = 2048 kB = 2MB, 10240001 = 10MB
aesEncryptionPassword: "1234"

emailConfig:
  enable: false
  senderEmail: "username@gmail.com"
  senderPassword: "password"

createPasswordEmailConfig:
  createPasswordLink: "http://localhost:8080/create_password"
  createPasswordSubject: "Forgot your password?"
  createPasswordMessage: '<div>
                                <div>Dear <b>%s</b>,</div>
                                <br></br><div>Please find OTP for creating new password: <b>%s</b></div>
                                <br></br><div><a href="%s">Click here</a> for creating new password or, open %s</div>
                                <br></br><div>Please do not reply to this email.</div>
                             </div>'
communicationConfig:
  tcpData:
    id_001:
      host: "127.0.0.1"
      port: 8086
      ttl: 4

socialLoginConfig:
  loginWithGmail: true
  googleLoginClientId: "googleLoginClientId"
  googleLoginClientSecretId: "googleLoginClientSecretId"

googleOAuthClientConfig:
  applicationName: "Google Sheets API"
  tokenDirPath: "D:/workspace/venv/google/sheets"
  credentialFilePath: "/client_secret_o-auth-sheets-api.json"
  localServerPort: 8888

enabledAuthPages:
  - login
  - forgot_password
  - create_password
  - register

ftlConfig:
  description: "Web Application description"
  keywords: "Web Application, File upload, PDF, JPEG, JPG, PNG"
  author: "Web Application Author"
  title: "Web Application"
  loginRedirectUrl: "/view-resource"
  gaTrackingId: "UA-177553408-1" # for development
  gaTrackingEnable: true
#  forgotPasswordPageInstruction: "Please contact admin."
  forgotPasswordPageInstruction: "Please contact admin to get create password otp."
  createPasswordOtpInstruction: "(Receive from admin)"
#  createPasswordOtpInstruction: "(Check your email)"
  headingJson: '[{"tag":"div.center.table.tbody.tr","className":"heading","text":[{"tag":"td","className":"text-center pl-5px","text":[{"tag":"div","text":"Heading Line 1 (config)"},{"tag":"div","text":"Larger Heading Line 2 Row"}]}]}]'
